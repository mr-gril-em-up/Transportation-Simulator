[package]
name = "transpo-sim"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace: app/ stays out of the root Cargo workspace owned by sim-core.
[workspace]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sim-core = { path = "../../crates/sim-core" }

# Optimize the simulation even in dev builds: unoptimized sim-core takes ~16 s to
# build the Travis scenario at startup; optimized it is ~4 s. The shell itself
# stays at opt-level 0 for fast rebuilds.
# Every dependency (sim-core, serde_json, rayon, tauri...) is optimized even in
# dev builds; only this crate stays at debug opt-level for fast rebuilds.
# Unoptimized serde_json alone made parsing the 27 MB Travis scenario slow (A16).
[profile.dev.package."*"]
opt-level = 3
