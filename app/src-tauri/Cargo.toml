[package]
name = "transpo-sim"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace: app/ stays out of the root Cargo workspace owned by sim-core.
[workspace]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sim-core = { path = "../../crates/sim-core" }  # enable when it lands
