name: app

# Builds and tests app/ (TypeScript client + Tauri shell). app/src-tauri is its
# own Cargo workspace, so the root workspace's checks do not cover it. sim-core
# is a path dependency, so its changes re-run this too.
on:
  pull_request:
    paths: ["app/**", "crates/sim-core/**", ".github/workflows/app.yml"]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build # tsc --noEmit + vite build
      - run: npm test

  tauri:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      # System libraries Tauri links against on Linux (webview, GTK).
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: tauri-${{ runner.os }}-${{ hashFiles('app/src-tauri/Cargo.lock') }}
      # generate_context! needs ../dist to exist; an empty folder is enough for check/test.
      - run: mkdir -p ../dist
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
